# LDO YAML file

# 1. OCEAN Script
# Value is the path to the corresponding maestro cellview.
ocn_script:
    assembler: ["${CADENCE_PROJECT_DIR}", 0, 0, 0, LDO2, LDO_tb, maestro ]

# 2. Design Variables
# Variables copied from "${CADENCE_PROJECT_DIR}"/ldo_var.csv.
# First column is min, second is max.
des_vars:
    L_MPT: [ .18e-6, 20e-6 ]
    ln1: [ .18e-6, 20e-6 ]
    ln2: [ .18e-6, 20e-6 ]
    ln3: [ .18e-6, 20e-6 ]
    ln4: [ .18e-6, 20e-6 ]
    ln5: [ .18e-6, 20e-6 ]
    ln6: [ .18e-6, 20e-6 ]
    lp1: [ .18e-6, 20e-6 ]
    lp2: [ .18e-6, 20e-6 ]
    lp4: [ .18e-6, 20e-6 ]
    W_MPT: [ .22e-6, 200e-6 ]
    wn1: [ .22e-6, 200e-6 ]
    wn2: [ .22e-6, 200e-6 ]
    wn3: [ .22e-6, 200e-6 ]
    wn4: [ .22e-6, 200e-6 ]
    wn5: [ .22e-6, 200e-6 ]
    wn6: [ .22e-6, 200e-6 ]
    wp1: [ .22e-6, 200e-6 ]
    wp2: [ .22e-6, 200e-6 ]
    wp4: [ .22e-6, 200e-6 ]
    nf1: [ 1, 20, 1 ]
    nf2: [ 1, 20, 1 ]
    nf3: [ 1, 20, 1 ]
    nf4: [ 1, 20, 1 ]
    nf5: [ 1, 20, 1 ]
    RD: [ 100e3, 1e6 ]
    RD2: [ 100e3, 1e6 ]

dependent_vars:

# 3. Responses
responses:
    assembler: [power, vout_min, vout_max, load_regulation, line_regulation, psrr]

# 4. Outputs
# Constraint direction follows the screenshot:
# power < 100u, vout in range 1.2 to 1.4, load/line regulation < 0.2, psrr > 50.
outputs:
    power:             [ 100e-6, target,    1, '*value']
    vout_min:          [ 1.15,    min, 0.83, '*value']
    vout_max:          [ 1.25,    max, 0.71, '*value']
    load_regulation:   [ 0.2,    max,    5, '*value']
    line_regulation:   [ 0.2,    max,    5, '*value']
    psrr:              [ 50,     min, 0.02, '*value']

# 5. MARL state features
# No agent_* sections yet. Add simulator CSV parameter names here when needed.
state_outputs: []

# 6. Options
options:
    corner_opt: 0
    parallel: 1
    parallel_max: 1

# 7. Algorithm Parameters
# 8. Objective and Constraints
objective:
    name: power
    minormax: min

constraints:

llm:
  enabled: True
  api_key: null  # Read OPENAI_API_KEY from the environment
  model: "deepseek-chat"
  base_url: "https://api.deepseek.com"
  frequency: 1
  temperature: 0.5
  max_tokens: 5000

intentions:
