# LDO YAML file

# 1. OCEAN Script
# Value is the path to the corresponding maestro cellview.
ocn_script:
    assembler: ["${CADENCE_PROJECT_DIR}", 0, 0, 0, LDO_FULL, LDO_tb, maestro ]

# 2. Design Variables
# Variables copied from "${CADENCE_PROJECT_DIR}"/ldo_var.csv.
# First column is min, second is max.
des_vars:
    L_MPT: [ .18e-6, 4e-6 ]
    W_MPT: [ .24e-6, 400e-6 ]
    RD: [100e3, 1e6]
    RD2: [100e3, 1e6]
    L1: [ 180e-9, 4e-6 ]
    L2: [ 180e-9, 4e-6 ]
    L3: [ 180e-9, 4e-6 ]
    L4: [ 180e-9, 4e-6 ]
    L5: [ 180e-9, 4e-6 ]
    L6: [ 180e-9, 4e-6 ]
    L7: [ 180e-9, 4e-6 ]
    W1: [ .24e-6, 150e-6 ]
    W2: [ .24e-6, 150e-6 ]
    W3: [ .24e-6, 150e-6 ]
    W4: [ .24e-6, 150e-6 ]
    W5: [ .24e-6, 150e-6 ]
    W6: [ .24e-6, 150e-6 ]
    W7: [ .24e-6, 150e-6 ]
    N1: [ 1, 20, 1]
    N2: [ 1, 20, 1]
    N8: [ 1, 20, 1]
    N9: [ 1, 20, 1]
    MCAP: [ 100e-15, 2e-12]
    Ln1: [ .18e-6, 20e-6 ]
    Ln2: [ .18e-6, 20e-6 ]
    Ln3: [ .18e-6, 20e-6 ]
    Ln4: [ .18e-6, 20e-6 ]
    Ln5: [ .18e-6, 20e-6 ]
    Ln6: [ .18e-6, 20e-6 ]
    Ln7: [ .18e-6, 20e-6 ]
    Ln8: [ .18e-6, 20e-6 ]
    Ln9: [ .18e-6, 20e-6 ]
    Ln10: [ .18e-6, 20e-6 ]
    Lp1: [ .18e-6, 20e-6 ]
    Lp2: [ .18e-6, 20e-6 ]
    Lp3: [ .18e-6, 20e-6 ]
    Wn1: [ .22e-6, 100e-6 ]
    Wn2: [ .22e-6, 100e-6 ]
    Wn3: [ .22e-6, 100e-6 ]
    Wn4: [ .22e-6, 100e-6 ]
    Wn5: [ .22e-6, 100e-6 ]
    Wn6: [ .22e-6, 100e-6 ]
    Wn7: [ .22e-6, 100e-6 ]
    Wn8: [ .22e-6, 1e-6 ]
    Wn9: [ .22e-6, 100e-6 ]
    Wn10: [ .22e-6, 100e-6 ]
    Wp1: [ .22e-6, 100e-6 ]
    Wp2: [ .22e-6, 100e-6 ]
    Wp3: [ .22e-6, 100e-6 ]
    NF_MPT: [ 1, 20, 1 ]

dependent_vars:

# 3. Responses
responses:
    assembler: [power, vout_min, vout_max, load_regulation, line_regulation, psrr, TC]

# 4. Outputs
# Constraint direction follows the screenshot:
# power < 100u, vout in range 1.2 to 1.4, load/line regulation < 0.2, psrr > 50.
outputs:
    power:             [ 1000e-6, target,    1, '*value']
    vout_min:          [ 1.15,    min, 0.83, '*value']
    vout_max:          [ 1.25,    max, 0.71, '*value']
    # Vref:              [ 0.5,  min,   2, '*value']
    # Vref2:             [ 0.7,  max,   2, '*value']
    load_regulation:   [ 0.2,    max,    5, '*value']
    line_regulation:   [ 0.2,    max,    5, '*value']
    psrr:              [ 50,     min, 0.02, '*value']
    # adm:               [ 20,   min, 0.05, '*value']
    TC:                [ 40,    max,    0.025, '*value']
    # psr:               [ -40,  max, 0.025, '*value']

# 5. MARL state features
# No agent_* sections yet. Add simulator CSV parameter names here when needed.
state_outputs: []

# 6. Options
options:
    corner_opt: 0
    parallel: 1
    parallel_max: 1

# 7. Algorithm Parameters
# 8. Objective and Constraints
objective:
    name: power
    minormax: min

constraints:

llm:
  enabled: True
  api_key: null  # Read OPENAI_API_KEY from the environment
  model: "deepseek-chat"
  base_url: "https://api.deepseek.com"
  frequency: 1
  temperature: 0.5
  max_tokens: 5000

intentions:
