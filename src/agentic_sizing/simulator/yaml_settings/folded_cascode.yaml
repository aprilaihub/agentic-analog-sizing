# OTA Project ADA YAML file
# Author: Miguel Gandara <miguel.gandara@gmail.com>

# 1. OCEAN Script
# Value is the path to the corresponding maestro cellview
ocn_script:
    assembler: ["${CADENCE_PROJECT_DIR}", 0, 0, 0, ada_tb, test, maestro ]

# 2. Design Variables
# Design variables are shared among all testbenches
# First column is min, second is max, third is initial value (optional)
des_vars:
    l1: [ .18e-6, 5e-6 ]
    l2: [ .18e-6, 5e-6 ]
    l3: [ .18e-6, 5e-6 ]
    l4: [ .18e-6, 5e-6 ]
    l5: [ .18e-6, 5e-6 ]
    l6: [ .18e-6, 5e-6 ]
    # l7: [ .18e-6, 5e-6 ]
    # l8: [ .18e-6, 5e-6 ]
    w1: [ .22e-6, 100e-6 ]
    w2: [ .22e-6, 100e-6 ]
    w3: [ .22e-6, 100e-6 ]
    w4: [ .22e-6, 100e-6 ]
    w5: [ .22e-6, 100e-6 ]
    w6: [ .22e-6, 100e-6 ]
    # w7: [ .22e-6, 100e-6 ]
    # w8: [ .22e-6, 100e-6 ]
    N1: [ 1, 10, 1]
    N2: [ 1, 10, 1]
    N3: [ 1, 10, 1]
    Idc: [ 1e-6, 10e-6 ]
    Idc2: [ 1e-6, 10e-6 ]
    Idc3: [ 1e-6, 10e-6 ]

# dependent vars
# these are variables that are dependent on values of the design variables. They will not be subject
# to random generation and mutation. The key is a function with the signature:
# var_value = calc_var(pop)
dependent_vars:

# 3. Responses
# Each key corresponds to a different testbench;
# Each value is a sequence of responses to the corresponding testbench
responses:
    assembler: [power, cmrr, adm, output_swing, pm, rms_noise_out, lg_ugb, psrr, slew_rate_rise, slew_rate_fall, region_m1, region_m3, region_m5, region_m6, region_m8, region_m10, region_m34, region_m89, region_m1011]

# 4. Outputs
# All the outputs
# constraints is combined in this section
outputs:
    power:             [ 100e-6, target,   1, '*value']
    cmrr:              [ 90,   min, 0.00111, '*value'] 
    adm:               [ 40,    min, 0.0015, '*value']
    output_swing:      [ 0.8,    min, 0.125, '*value']
    pm:                [ 60,   min, 0.002, '*value']
    rms_noise_out:     [ 200e-6,   max, 1428, '*value']
    lg_ugb:            [ 2e6, min, 0.05e-6, '*value']
    psrr:              [ 60,   min, 0.0015, '*value']
    slew_rate_rise:    [ 2e6,   min, 0.05e-6, '*value']
    slew_rate_fall:    [ 2e6,   min, 0.05e-6, '*value']
    region_m1:        [ 3,    target,   0, '*value']
    region_m3:        [ 1,    target,   0, '*value']
    region_m5:        [ 3,    target,   0, '*value']
    region_m6:        [ 3,    target,   0, '*value']
    region_m8:        [ 3,    target,   0, '*value']
    region_m10:        [ 3,    target,   0, '*value']
    region_m34:        [ 2,    target,   0, '*value']
    region_m89:        [ 2,    target,   0, '*value']
    region_m1011:        [ 2,    target,   0, '*value']

# 6. Options
options:
    corner_opt: 0
    parallel: 1
    parallel_max: 1

# 6. Algorithm Parameters
# 7. Objective and Constraints
objective:
    name: power
    minormax: min

constraints:

llm:
  enabled: True
  api_key: null  # Read OPENAI_API_KEY from the environment
  model: "deepseek-chat"
  base_url: "https://api.deepseek.com"
  frequency: 1  # Use LLM every 5 iterations
  temperature: 0.5
  max_tokens: 5000

intentions:
