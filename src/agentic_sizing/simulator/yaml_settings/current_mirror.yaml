# OTA Project ADA YAML file
# Author: Miguel Gandara <miguel.gandara@gmail.com>

# 1. OCEAN Script
# Value is the path to the corresponding maestro cellview
ocn_script:
    assembler: ["${CADENCE_PROJECT_DIR}", 0, 0, 0, ada_tb, test, maestro ]

# 2. Design Variables
# Design variables are shared among all testbenches
# First column is min, second is max, third is initial value (optional)
des_vars:
    l1: [ .06e-6, 5e-6 ]
    l2: [ .06e-6, 5e-6 ]
    l3: [ .06e-6, 5e-6 ]
    l4: [ .06e-6, 5e-6 ]
    w1: [ .12e-6, 100e-6 ]
    w2: [ .12e-6, 100e-6 ]
    w3: [ .12e-6, 100e-6 ]
    w4: [ .12e-6, 100e-6 ]
    N3: [ 1, 10, 1]
    Idc: [ 1e-6, 10e-6 ]

# dependent vars
# these are variables that are dependent on values of the design variables. They will not be subject
# to random generation and mutation. The key is a function with the signature:
# var_value = calc_var(pop)
dependent_vars:

# 3. Responses
# Each key corresponds to a different testbench;
# Each value is a sequence of responses to the corresponding testbench
responses:
    assembler: [power, cmrr, adm, output_swing, pm, rms_noise_out, lg_ugb, psrr, slew_rate_rise, slew_rate_fall]

# 4. Outputs
# All the outputs
# constraints is combined in this section
outputs:
    power:             [ 100e-6, target,   1, '*value']
    cmrr:              [ 80,   min, 0.00125, '*value'] 
    adm:               [ 30,    min, 0.003, '*value']
    output_swing:      [ 1.1,    min, 0.09, '*value']
    pm:                [ 60,   min, 0.002, '*value']
    rms_noise_out:     [ 200e-6,   max, 500, '*value']
    lg_ugb:            [ 5e6, min, 0.02e-6, '*value']
    psrr:              [ 30,   min, 0.003, '*value']
    slew_rate_rise:    [ 5e6,   min, 0.02e-6, '*value']
    slew_rate_fall:    [ 5e6,   min, 0.02e-6, '*value']

# 5. MARL state features (returned from simulator CSV rows)
# These must be parameter names present in simulation result CSV.
state_outputs: [gm0, gm1, gm2, gm3, gm4, vdsat0, vdsat1, vdsat2, vdsat3, vdsat4]

# Optional: per-agent local observation assignment by state feature name.
# If omitted, code will split state_outputs evenly across agents.
agent_state_map:
    "0": [gm0, gm1, gm2, gm3, gm4, vdsat0, vdsat1, vdsat2, vdsat3, vdsat4]

# 6. Options
options:
    corner_opt: 0
    parallel: 1
    parallel_max: 1

# 6. Algorithm Parameters
# 7. Objective and Constraints
objective:
    name: power
    minormax: min

constraints:

llm:
  enabled: True
  api_key: null  # Read OPENAI_API_KEY from the environment
  model: "deepseek-chat"
  base_url: "https://api.deepseek.com"
  frequency: 1  # Use LLM every 5 iterations
  temperature: 0.5
  max_tokens: 5000

intentions:
