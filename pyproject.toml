[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sizing"
version = "0.1.0"
description = "Reusable agentic workflows for analog-circuit sizing research"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
  "langgraph>=0.2,<0.4",
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
openai = ["openai>=1,<3"]
cadence = ["numpy>=1.26,<3", "PyYAML>=6,<7"]
dev = [
  "build>=1.2",
  "detect-secrets>=1.5",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "twine>=5",
]

[project.scripts]
agentic-sizing = "agentic_sizing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_sizing = [
  "resources/prompts/**/*.md",
  "**/*.schema.json",
  "**/*.example.json",
  "specs/*.json",
  "simulator/yaml_settings/*.yaml",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["cadence: requires a licensed local Cadence installation"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["output", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_sizing"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = [
  "src/agentic_sizing/api.py",
  "src/agentic_sizing/simulator/base.py",
  "src/agentic_sizing/core/models.py",
]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["agentic_sizing"]
